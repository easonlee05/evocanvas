# ==============================================================================
# EvoCanvas 生产环境 Nginx 反向代理配置模板
# 可直接放入 /etc/nginx/conf.d/evocanvas.conf 或 include 到主配置中
# ==============================================================================

# Gzip 压缩配置（大幅降低前端 JS/CSS 首次传输耗时）
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

# HTTP 服务配置（监听 80 端口）
server {
    listen 80;
    server_name your-domain.com; # 替换为你的真实域名或云服务器 IP

    # 如果配置了 SSL，建议取消下方注释将 HTTP 强制跳转为 HTTPS：
    # return 301 https://$host$request_uri;

    # 客户端上传文件体积限制（适配需求文档/截图/材料上传）
    client_max_body_size 50M;

    # 静态资产长效缓存（Vite 构建的文件带有哈希名，可安全强缓存）
    location /assets/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # API 与 Server-Sent Events (SSE) 事件流关键配置
    # 注意：画布主链与 AI 收敛依赖 SSE 流式推送，必须关闭代理缓冲
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 核心：流式传输支持
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # 超时时间设置（避免大模型长推理回合被 Nginx 提前切断）
        proxy_read_timeout 600s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
    }

    # 前端单页应用 (SPA) 路由代理
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

